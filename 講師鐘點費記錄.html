<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講師鐘點費記錄</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2c5e4f;
      --primary-dark: #1e4237;
      --bg: #f1f5f9;
      --border: #cbd5e1;
      --text: #1e293b;
    }
    * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }

    nav.topbar {
      background-color: var(--primary); color: #fff; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      position: relative; z-index: 500;
    }
    .brand { font-weight: bold; font-size: 1.15rem; color: #fff; text-decoration: none; }
    .nav-menu { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .nav-item { position: relative; }
    .nav-btn {
      color: #fff; text-decoration: none; padding: 7px 13px; border-radius: 5px;
      font-size: 0.95rem; background: rgba(255,255,255,0.12); border: none;
      cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 5px;
    }
    .nav-btn:hover, .nav-item:hover .nav-btn, .nav-btn.active { background: rgba(255,255,255,0.28); }
    .dropdown-content {
      display: none; position: absolute; top: 100%; left: 0; min-width: 265px;
      background: #ffffff; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      border: 1px solid #cbd5e1; padding: 6px 0; z-index: 600;
    }
    .nav-item:hover .dropdown-content { display: block; }
    .dropdown-content a {
      display: block; padding: 9px 15px; color: #1e293b; text-decoration: none;
      font-size: 0.93rem; border-bottom: 1px solid #f1f5f9;
    }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover { background: #f0fdfa; color: var(--primary); font-weight: bold; }
    .dropdown-divider { font-size: 0.78rem; color: #64748b; padding: 5px 15px 3px 15px; font-weight: bold; background: #f8fafc; }

    .container { max-width: 1420px; margin: 18px auto 50px auto; padding: 0 16px; }
    .card {
      background: #fff; border-radius: 10px; padding: 16px 20px;
      border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
    }
    .page-h1 { margin: 0; font-size: 1.3rem; color: var(--primary); }

    .mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .mode-tab {
      padding: 8px 15px; border-radius: 7px; border: 1.5px solid var(--border);
      background: #f8fafc; color: #334155; font-weight: bold; cursor: pointer; font-size: 0.95rem;
    }
    .mode-tab.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    .controls-row {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 8px;
      margin-bottom: 12px;
    }
    select, input[type="text"], input[type="number"] {
      padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;
    }
    .btn {
      padding: 7px 12px; border: none; border-radius: 6px; font-weight: bold;
      cursor: pointer; font-size: 0.88rem; transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-blue:hover { background: #1d4ed8; }
    .btn-teal { background: #0f766e; color: #fff; }
    .btn-teal:hover { background: #115e59; }
    .btn-outline { background: #fff; color: #1e293b; border: 1px solid #cbd5e1; }
    .btn-outline:hover { background: #e2e8f0; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }

    .sheet-title-banner {
      text-align: center; font-size: 1.2rem; font-weight: bold;
      color: #0f172a; padding: 6px 0 10px 0;
    }
    .excel-table {
      width: 100%; border-collapse: collapse; font-size: 0.92rem; background: #fff;
    }
    .excel-table th {
      background: #cbd5e1; color: #0f172a; font-weight: bold;
      border: 1px solid #64748b; padding: 7px 8px; text-align: center;
    }
    .excel-table td {
      border: 1px solid #94a3b8; padding: 6px 8px; vertical-align: middle;
    }
    .excel-table td.num-col { text-align: right; font-variant-numeric: tabular-nums; }
    .excel-table td.center-col { text-align: center; }
    .excel-table tr.total-row td {
      background: #cbd5e1; font-weight: bold; font-size: 0.96rem; color: #0f172a;
    }
    .excel-table input, .excel-table select {
      width: 100%; padding: 5px 7px; font-size: 0.88rem; border: 1px solid #cbd5e1; border-radius: 4px;
    }
    .excel-table input.num-input { text-align: right; }

    .picker-dropdown-wrap {
      position: relative; display: inline-block;
    }
    .picker-panel {
      display: none; position: absolute; top: 100%; left: 0; min-width: 280px; max-height: 320px; overflow-y: auto;
      background: #fff; border: 1px solid #94a3b8; border-radius: 8px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.16); padding: 10px; z-index: 400; margin-top: 4px;
    }
    .picker-panel.open { display: block; }
    .picker-item {
      display: flex; align-items: center; gap: 6px; padding: 5px 6px;
      border-radius: 5px; cursor: pointer; font-size: 0.88rem; font-weight: bold;
    }
    .picker-item:hover { background: #f1f5f9; }

    .sub-box {
      background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 12px;
    }
    .sub-box-title {
      font-weight: bold; font-size: 0.95rem; color: var(--primary); margin-bottom: 8px;
    }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .course-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc;
      border-radius: 14px; padding: 3px 9px; font-size: 0.82rem; font-weight: bold;
    }
    .course-tag button {
      border: none; background: none; color: #075985; font-weight: bold; cursor: pointer; padding: 0;
    }

    @media print {
      nav.topbar, .no-print { display: none !important; }
      body { background: #fff; }
      .container { max-width: 100%; margin: 0; padding: 0; }
      .card { border: none; box-shadow: none; padding: 0; }
    }
  </style>
</head>

<div class="container">
  <div class="card">
    <div class="top-bar">
      <h1 class="page-h1">講師鐘點費記錄</h1>
      <div class="no-print" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span id="statusText" style="font-size:0.86rem; font-weight:bold; color:#166534;"></span>

    </div>

    <div class="mode-tabs no-print">
      <button type="button" class="mode-tab active" id="tabFee" onclick="switchTab('fee')">1. 鐘點費計算</button>
      <button type="button" class="mode-tab" id="tabTaxInstructor" onclick="switchTab('taxInstructor')">2. 個人所得稅計算-講師</button>

        <select id="feeYearSelect" onchange="onFeeContextChange()">
          <option value="115">115 年</option>
          <option value="116">116 年</option>
          <option value="117">117 年</option>
        </select>

        <label style="font-weight:bold;">講師姓名：</label>
        <select id="feeInstructorSelect" onchange="onFeeContextChange(true)"></select>

        <div class="picker-dropdown-wrap">
          <button type="button" class="btn btn-outline btn-sm" onclick="togglePickerPanel('feeInstPickerPanel')">勾選本年度講師 ▾</button>
          <div class="picker-panel" id="feeInstPickerPanel"></div>
        </div>

        <label style="font-weight:bold;">計畫課程名稱：</label>
        <select id="feeCourseSelect"></select>
        <input type="text" id="newFeeCourseInput" placeholder="新增課程名稱" style="width:130px;">

      </div>

<script>
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let activeTab = 'fee';
  let currentYear = 115;
  let masterInstructors = [];
  let checkedInstructors = [];
  let currentFeeInstructor = '';

  // 1. 鐘點費明細：[{ id, course_name, period_text, days, hours, rate, amount, remark }]
  let feeRows = [];
  let feeCourseOptions = ['關懷課程', '多元課程', '延緩1期', '延緩2期', '伯公課程', '樂齡-活躍老化'];

  // 2. 個人所得稅-講師：課程清單與矩陣 rows: [{ id, course_name, values: { [name]: numberOrText } }]
  let taxCourseOptions = ['關懷1-3月', '關懷4-6月', '關懷7-9月', '關懷10-12月', '延緩1期', '延緩2期', '多元', '伯公'];
  let taxMatrixRows = [];

  // 3. 個人所得稅_臨時人員：從 temp_staff_hours 讀取
  let tempStaffList = [];
  let tempHoursRecords = [];

  function fmtNum(n) {
    const num = Number(n || 0);
    return Number.isFinite(num) ? num.toLocaleString('en-US') : '0';
  }

  function setStatus(msg, isErr = false) {
    const el = document.getElementById('statusText');
    el.style.color = isErr ? '#dc2626' : '#166534';
    el.textContent = msg;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function escapeAttr(s) {
    return String(s || '').replace(/"/g, '&quot;');
  }

  function togglePickerPanel(panelId) {
    const panel = document.getElementById(panelId);
    document.querySelectorAll('.picker-panel').forEach(p => {
      if (p.id !== panelId) p.classList.remove('open');
    });
    if (panel) panel.classList.toggle('open');
  }

  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('.picker-dropdown-wrap')) {
      document.querySelectorAll('.picker-panel').forEach(p => p.classList.remove('open'));
    }
  });

  (async function init() {
    await loadInstructorsFromHr();
    await onFeeContextChange();
  })();

  async function loadInstructorsFromHr() {
    try {
      const { data, error } = await supabaseClient
        .from('instructors')
        .select('id, staff_number, name, status, hire_type')
        .order('staff_number', { ascending: true })
        .order('id', { ascending: true });
      if (!error && Array.isArray(data) && data.length > 0) {
        masterInstructors = data.filter(r => r.name && r.name.trim() !== '').map(r => ({
          name: r.name.trim(),
          status: r.status || '服務中',
          hire_type: r.hire_type || ''
        }));
      }
    } catch (e) {}

    if (masterInstructors.length === 0) {
      masterInstructors = [
        { name: '林熙鈴', status: '服務中', hire_type: '外聘' },
        { name: '張國堂', status: '服務中', hire_type: '外聘' },
        { name: '鄧美續', status: '服務中', hire_type: '內聘' },
        { name: '蔡牡連', status: '服務中', hire_type: '內聘' },
        { name: '吳佩珊', status: '暫停', hire_type: '外聘' },
        { name: '黃仲慧', status: '服務中', hire_type: '外聘' },
        { name: '吳貴英', status: '服務中', hire_type: '' },
        { name: '詹細珍', status: '服務中', hire_type: '' },
        { name: '詹益誠', status: '服務中', hire_type: '' }
      ];
    }
  }

  function getCheckedInstKey() {
    return `lz_fee_checked_inst_${currentYear}`;
  }

  function loadCheckedInstructorsForYear() {
    const saved = localStorage.getItem(getCheckedInstKey());
    if (saved) {
      try {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) {
          checkedInstructors = arr;
          return;
        }
      } catch (e) {}
    }
    checkedInstructors = masterInstructors.filter(i => i.status === '服務中').map(i => i.name);
    localStorage.setItem(getCheckedInstKey(), JSON.stringify(checkedInstructors));
  }

  let multiFeeMap = {}; // { [instructorName]: rows[] }
  let showAllCheckedInstructorsInFee = true;

  function onInstructorCheckChange(name, isChecked) {
    if (isChecked) {
      if (!checkedInstructors.includes(name)) checkedInstructors.push(name);
      if (!currentFeeInstructor) currentFeeInstructor = name;
    } else {
      checkedInstructors = checkedInstructors.filter(n => n !== name);
      if (currentFeeInstructor === name) currentFeeInstructor = checkedInstructors[0] || '';
    }
    const orderMap = new Map(masterInstructors.map((m, idx) => [m.name, idx]));
    checkedInstructors.sort((a, b) => (orderMap.get(a) ?? 999) - (orderMap.get(b) ?? 999));
    localStorage.setItem(getCheckedInstKey(), JSON.stringify(checkedInstructors));

    // Whenever user checks/unchecks instructors in "勾選本年度講師", show all checked instructors together on the page
    showAllCheckedInstructorsInFee = checkedInstructors.length > 0;
    if (isChecked) {
      currentFeeInstructor = name;
    }

    renderPickerPanels();
    renderFeeInstructorSelect();
    if (activeTab === 'fee') {
      if (showAllCheckedInstructorsInFee) {
        loadAllCheckedInstructorsFee();
      } else {
        loadFeeRecordsForInstructor();
      }
    } else if (activeTab === 'taxInstructor') {
      renderTaxInstructorTable();
    }
  }

  function renderPickerPanels() {
    const itemsHtml = masterInstructors.map(m => {
      const isChk = checkedInstructors.includes(m.name);
      return `
        <label class="picker-item">
          <input type="checkbox" ${isChk ? 'checked' : ''} onchange="onInstructorCheckChange('${escapeAttr(m.name)}', this.checked)">
          <span>${escapeHtml(m.name)}</span>
          <span style="font-size:0.75rem; color:#64748b; font-weight:normal;">(${escapeHtml(m.status)})</span>
        </label>
      `;
    }).join('');

    const p1 = document.getElementById('feeInstPickerPanel');
    const p2 = document.getElementById('taxInstPickerPanel');
    if (p1) p1.innerHTML = itemsHtml;
    if (p2) p2.innerHTML = itemsHtml;

    const btn2 = document.getElementById('taxInstDropdownBtn');
    if (btn2) btn2.textContent = `勾選列出講師 (${checkedInstructors.length}) ▾`;

  function renderFeeInstructorSelect() {
    const sel = document.getElementById('feeInstructorSelect');
    if (checkedInstructors.length === 0) {
      sel.innerHTML = `<option value="">請勾選講師</option>`;
      currentFeeInstructor = '';
      return;
    }
    const prev = sel.value || currentFeeInstructor;
    sel.innerHTML = checkedInstructors.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
    if ([...sel.options].some(o => o.value === prev)) {
      sel.value = prev;
      currentFeeInstructor = prev;
    } else {
      currentFeeInstructor = checkedInstructors[0];
      sel.value = currentFeeInstructor;
    }
  }

  function renderFeeCourseSelect() {
    const sel = document.getElementById('feeCourseSelect');
    sel.innerHTML = feeCourseOptions.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
  }

  function addFeeCourseOption() {
    const inp = document.getElementById('newFeeCourseInput');
    const val = inp.value.trim();
    if (!val) return;
    if (!feeCourseOptions.includes(val)) {
      feeCourseOptions.push(val);
      renderFeeCourseSelect();
    }
    document.getElementById('feeCourseSelect').value = val;
    inp.value = '';
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tabFee').classList.toggle('active', tab === 'fee');
    document.getElementById('tabTaxInstructor').classList.toggle('active', tab === 'taxInstructor');
    document.getElementById('tabTaxTemp').classList.toggle('active', tab === 'taxTemp');

    document.getElementById('panelFee').style.display = (tab === 'fee') ? 'block' : 'none';
    document.getElementById('panelTaxInstructor').style.display = (tab === 'taxInstructor') ? 'block' : 'none';
    document.getElementById('panelTaxTemp').style.display = (tab === 'taxTemp') ? 'block' : 'none';

    if (tab === 'fee') {
      document.getElementById('feeYearSelect').value = String(currentYear);
      onFeeContextChange();
    } else if (tab === 'taxInstructor') {
      document.getElementById('taxYearSelect').value = String(currentYear);
      onTaxContextChange();
    } else if (tab === 'taxTemp') {
      document.getElementById('tempYearSelect').value = String(currentYear);
      loadTempStaffQuarterData();
    }
  }

  async function onFeeContextChange(fromDropdown = false) {
    currentYear = parseInt(document.getElementById('feeYearSelect').value, 10) || 115;
    loadCheckedInstructorsForYear();
    renderPickerPanels();
    renderFeeInstructorSelect();
    renderFeeCourseSelect();
    if (fromDropdown) {
      const selVal = document.getElementById('feeInstructorSelect').value;
      if (selVal) currentFeeInstructor = selVal;
      showAllCheckedInstructorsInFee = false;
      await loadFeeRecordsForInstructor();
    } else if (showAllCheckedInstructorsInFee && checkedInstructors.length > 0) {
      await loadAllCheckedInstructorsFee();
    } else {
      await loadFeeRecordsForInstructor();
    }
  }

  function getFeeStorageKeyFor(instName) {
    return `lz_fee_detail_${currentYear}_${instName}`;
  }

  function getFeeStorageKey() {
    return getFeeStorageKeyFor(currentFeeInstructor);
  }

  async function fetchSingleInstructorRows(instName) {
    if (!instName) return [];
    try {
      const { data, error } = await supabaseClient
        .from('instructor_fee_records')
        .select('*')
        .eq('roc_year', currentYear)
        .eq('instructor_name', instName)
        .eq('entry_type', 'actual')
        .order('sort_order', { ascending: true })
        .order('id', { ascending: true });
      if (!error && Array.isArray(data) && data.length > 0) {
        return data.map(r => ({
          id: r.id,
          course_name: r.course_name || '',
          period_text: r.period_text || '',
          days: r.days ?? '',
          hours: r.hours ?? '',
          rate: r.rate ?? '',
          amount: Number(r.amount || 0),
          remark: r.remark || ''
        }));
      }
    } catch (e) {}
    const raw = localStorage.getItem(getFeeStorageKeyFor(instName));
    if (raw) {
      try { return JSON.parse(raw); } catch (e) { return []; }
    }
    return [];
  }

  async function loadAllCheckedInstructorsFee() {
    multiFeeMap = {};
    for (const name of checkedInstructors) {
      const rows = await fetchSingleInstructorRows(name);
      multiFeeMap[name] = rows.length > 0 ? rows : [{
        id: 'init_' + name + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        course_name: document.getElementById('feeCourseSelect')?.value || '關懷課程',
        period_text: '',
        days: '',
        hours: 1,
        rate: '',
        amount: 0,
        remark: ''
      }];
    }
    if (currentFeeInstructor && multiFeeMap[currentFeeInstructor]) {
      feeRows = multiFeeMap[currentFeeInstructor];
    }
    renderFeeTable();
  }

  async function loadFeeRecordsForInstructor() {
    if (!currentFeeInstructor) {
      feeRows = [];
      renderFeeTable();
      return;
    }

    feeRows = await fetchSingleInstructorRows(currentFeeInstructor);
    renderFeeTable();
  }

  function calcFeeAmount(days, hours, rate) {
    const d = Number(days || 0);
    const h = Number(hours || 0);
    const r = Number(rate || 0);
    if (!d && !r) return 0;
    const mult = (h > 0 && d > 0) ? (d * h) : d;
    return Math.round(mult * r);
  }

  function addFeeRowFromToolbar() {
    const targetInst = currentFeeInstructor || checkedInstructors[0] || '';
    if (!targetInst) { alert('請先勾選講師'); return; }
    currentFeeInstructor = targetInst;
    const courseName = document.getElementById('feeCourseSelect').value || '關懷課程';
    const newRow = {
      id: 'row_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
      course_name: courseName,
      period_text: '',
      days: '',
      hours: 1,
      rate: '',
      amount: 0,
      remark: ''
    };
    if (showAllCheckedInstructorsInFee && multiFeeMap[targetInst]) {
      multiFeeMap[targetInst].push(newRow);
    } else {
      feeRows.push(newRow);
    }
    renderFeeTable();
  }

  // Update field smoothly without losing keyboard focus or requiring backspace before typing!
  function onFeeFieldChange(rowId, field, value, instOwner = null) {
    let list = feeRows;
    if (instOwner && multiFeeMap[instOwner]) {
      list = multiFeeMap[instOwner];
    } else if (showAllCheckedInstructorsInFee) {
      for (const k of Object.keys(multiFeeMap)) {
        const hit = multiFeeMap[k].find(r => String(r.id) === String(rowId));
        if (hit) { list = multiFeeMap[k]; break; }
      }
    }
    const item = list.find(r => String(r.id) === String(rowId));
    if (!item) return;
    item[field] = value;

    const tr = document.querySelector(`tr[data-fee-row-id="${rowId}"]`);
    if (['days', 'hours', 'rate'].includes(field)) {
      const hasNum = String(item.days ?? '').trim() !== '' && String(item.rate ?? '').trim() !== '';
      item.amount = hasNum ? calcFeeAmount(item.days, item.hours, item.rate) : 0;
      if (tr) {
        const amtCell = tr.querySelector('.row-amount-cell');
        if (amtCell) amtCell.textContent = fmtNum(item.amount);
      }
      refreshFeeTotalsDom();
    }
  }

  function refreshFeeTotalsDom() {
    if (showAllCheckedInstructorsInFee) {
      let grandDays = 0;
      let grandAmt = 0;
      checkedInstructors.forEach(name => {
        const rows = multiFeeMap[name] || [];
        const dSum = rows.reduce((s, r) => s + (Number(r.days) || 0), 0);
        const aSum = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
        grandDays += dSum;
        grandAmt += aSum;
        const secTotal = document.getElementById(`inst_subtotal_${name}`);
        if (secTotal) {
          secTotal.querySelector('.sub-days-val').textContent = dSum > 0 ? fmtNum(dSum) : '';
          secTotal.querySelector('.sub-amt-val').textContent = fmtNum(aSum);
        }
      });
      const gRow = document.getElementById('fee_grand_total_row');
      if (gRow) {
        gRow.querySelector('.grand-days-val').textContent = grandDays > 0 ? fmtNum(grandDays) : '';
        gRow.querySelector('.grand-amt-val').textContent = fmtNum(grandAmt);
      }
    } else {
      const totalDays = feeRows.reduce((s, r) => s + (Number(r.days) || 0), 0);
      const totalAmt = feeRows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const tRow = document.getElementById('fee_single_total_row');
      if (tRow) {
        tRow.querySelector('.single-days-val').textContent = totalDays > 0 ? fmtNum(totalDays) : '';
        tRow.querySelector('.single-amt-val').textContent = fmtNum(totalAmt);
      }
    }
  }

  function deleteFeeRow(rowId, instOwner = null) {
    if (instOwner && multiFeeMap[instOwner]) {
      multiFeeMap[instOwner] = multiFeeMap[instOwner].filter(r => String(r.id) !== String(rowId));
    } else {
      feeRows = feeRows.filter(r => String(r.id) !== String(rowId));
    }
    renderFeeTable();
  }

  function onCalendarModeToggle() {
    const checked = document.getElementById('useCalendarActualChk').checked;
    document.getElementById('calendarCalcControls').style.display = checked ? 'inline-flex' : 'none';
  }

  async function calculateFromCalendar() {
    const targets = (showAllCheckedInstructorsInFee && checkedInstructors.length > 0)
      ? checkedInstructors
      : (currentFeeInstructor ? [currentFeeInstructor] : []);
    if (targets.length === 0) { alert('請先選擇或勾選講師'); return; }

    const adYear = currentYear + 1911;
    const rawH = document.getElementById('calDefaultHoursInput').value.trim();
    const defHours = rawH !== '' ? Number(rawH) : 1;
    const rawR = document.getElementById('calDefaultRateInput').value.trim();
    const hasDefRate = rawR !== '' && Number.isFinite(Number(rawR));
    const defRate = hasDefRate ? Number(rawR) : '';

    setStatus('讀取行事曆排課資料...');

    try {
      const { data, error } = await supabaseClient
        .from('course_schedules')
        .select('*')
        .gte('course_date', `${adYear}-01-01`)
        .lte('course_date', `${adYear}-12-31`)
        .in('instructor_name', targets)
        .order('course_date', { ascending: true });

      if (error || !data || data.length === 0) {
        alert(`行事曆中查無所選講師 ${currentYear} 年排課記錄`);
        setStatus('');
        return;
      }

      let totalImported = 0;

      targets.forEach(instName => {
        const instSchedules = data.filter(c => (c.instructor_name || '').trim() === instName);
        if (instSchedules.length === 0) return;

        const map = new Map();
        instSchedules.forEach(c => {
          const cleanName = String(c.course_name || '課程').replace('｜', ' - ');
          if (!feeCourseOptions.includes(cleanName)) {
            feeCourseOptions.push(cleanName);
          }
          if (!map.has(cleanName)) map.set(cleanName, []);
          const p = String(c.course_date || '').split('-');
          if (p.length === 3) map.get(cleanName).push(`${parseInt(p[1], 10)}/${parseInt(p[2], 10)}`);
        });

        const builtRows = [];
        map.forEach((dates, cName) => {
          const days = dates.length;
          const period = dates.length > 1 ? `${dates[0]}-${dates[dates.length - 1]}` : (dates[0] || '');
          builtRows.push({
            id: 'cal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            course_name: cName,
            period_text: period,
            days,
            hours: defHours,
            rate: defRate,
            amount: hasDefRate ? calcFeeAmount(days, defHours, defRate) : 0,
            remark: ''
          });
        });

        totalImported += builtRows.length;
        if (showAllCheckedInstructorsInFee) {
          multiFeeMap[instName] = builtRows;
        }
        if (instName === currentFeeInstructor || targets.length === 1) {
          feeRows = builtRows;
        }
      });

      renderFeeCourseSelect();
      setStatus(`已依行事曆帶入 ${totalImported} 筆課程天數，請依各課程主題填入「費用 / 1H」`);
      renderFeeTable();
    } catch (e) {
      setStatus('讀取行事曆失敗', true);
    }
  }

  async function saveFeeRecords() {
    const targets = showAllCheckedInstructorsInFee && checkedInstructors.length > 0
      ? checkedInstructors
      : (currentFeeInstructor ? [currentFeeInstructor] : []);
    if (targets.length === 0) { alert('請先選擇或勾選講師'); return; }

    try {
      for (const instName of targets) {
        const rowsToSave = showAllCheckedInstructorsInFee ? (multiFeeMap[instName] || []) : feeRows;
        localStorage.setItem(getFeeStorageKeyFor(instName), JSON.stringify(rowsToSave));
        await supabaseClient
          .from('instructor_fee_records')
          .delete()
          .eq('roc_year', currentYear)
          .eq('instructor_name', instName)
          .eq('entry_type', 'actual');

        if (rowsToSave.length > 0) {
          const payload = rowsToSave.map((r, idx) => ({
            roc_year: currentYear,
            instructor_name: instName,
            entry_type: 'actual',
            plan_name: null,
            course_name: r.course_name || '',
            period_text: r.period_text || '',
            days: r.days === '' ? null : Number(r.days),
            hours: r.hours === '' ? null : Number(r.hours),
            rate: r.rate === '' ? null : Number(r.rate),
            amount: Number(r.amount || 0),
            remark: r.remark || '',
            sort_order: idx + 1
          }));
          const { error } = await supabaseClient.from('instructor_fee_records').insert(payload);
          if (error) throw error;
        }
      }
      setStatus(`已儲存 ${currentYear} 年 ${targets.join('、')} 鐘點費`);
    } catch (e) {
      setStatus('已儲存至本機');
    }
  }

    return `
      <select onchange="onFeeFieldChange('${rowId}', 'course_name', this.value, ${ownerArg})" style="width:100%;">
        <option value="">— 選擇課程 —</option>
        ${customOpt}
        ${opts}
      </select>
    `;

        <td><input type="text" inputmode="decimal" class="num-input" value="${r.hours ?? ''}" oninput="onFeeFieldChange('${r.id}', 'hours', this.value, ${ownerArg})" placeholder="時數"></td>
        <td><input type="text" inputmode="decimal" class="num-input" value="${r.rate ?? ''}" oninput="onFeeFieldChange('${r.id}', 'rate', this.value, ${ownerArg})" placeholder="每小時費用"></td>

    currentFeeInstructor = instName;

    if (sel && [...sel.options].some(o => o.value === instName)) sel.value = instName;

      let grandAmt = 0;

  function getTaxCoursesKey() {

  function getTaxMatrixKey() {

  async function onTaxContextChange() {
    currentYear = parseInt(document.getElementById('taxYearSelect').value, 10) || 115;
    loadCheckedInstructorsForYear();

    const savedC = localStorage.getItem(getTaxCoursesKey());

    renderTaxCourseChips();

  function renderTaxCourseChips() {
    const wrap = document.getElementById('taxCourseChipList');
    wrap.innerHTML = taxCourseOptions.map((c, idx) => `
      <span class="course-tag">
        <span>${escapeHtml(c)}</span>
        <button type="button" onclick="removeTaxCourseOption(${idx})" title="移除">×</button>
      </span>
    `).join('');
  }

  function addTaxCourseOption() {
    const inp = document.getElementById('newTaxCourseInput');
    const val = inp.value.trim();
    if (!val) return;
    if (!taxCourseOptions.includes(val)) {
      taxCourseOptions.push(val);
      localStorage.setItem(getTaxCoursesKey(), JSON.stringify(taxCourseOptions));
      renderTaxCourseChips();
    }
    if (taxMatrixRows.length > 0) {
      taxMatrixRows[taxMatrixRows.length - 1].course_name = val;
      renderTaxInstructorTable();
    }
    inp.value = '';
  }

  function removeTaxCourseOption(idx) {
    taxCourseOptions.splice(idx, 1);
    localStorage.setItem(getTaxCoursesKey(), JSON.stringify(taxCourseOptions));
    renderTaxCourseChips();
    renderTaxInstructorTable();
  }

  function addTaxMatrixRow() {
    taxMatrixRows.push({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
      course_name: taxCourseOptions[0] || '',
      values: {}
    });
    renderTaxInstructorTable();
  }

  function deleteTaxMatrixRow(rowId) {
    taxMatrixRows = taxMatrixRows.filter(r => String(r.id) !== String(rowId));
    renderTaxInstructorTable();
  }

  function onTaxRowCourseChange(rowId, val) {
    const row = taxMatrixRows.find(r => String(r.id) === String(rowId));
    if (row) row.course_name = val;
  }

  function onTaxCellChange(rowId, instName, val) {
    const row = taxMatrixRows.find(r => String(r.id) === String(rowId));
    if (!row) return;
    const cleaned = String(val).replace(/,/g, '').trim();
    row.values[instName] = cleaned;
    renderTaxInstructorTable();
  }

  function saveTaxInstructorData() {
    localStorage.setItem(getTaxCoursesKey(), JSON.stringify(taxCourseOptions));
    localStorage.setItem(getTaxMatrixKey(), JSON.stringify(taxMatrixRows));
    setStatus(`已儲存 ${currentYear} 年度個人所得稅計算-講師資料`);
  }

  function renderTaxInstructorTable() {
    document.getElementById('taxInstTitle').textContent = `${currentYear}年度講師鐘點費統計`;
    const cols = checkedInstructors;

    const headEl = document.getElementById('taxInstHead');
    const bodyEl = document.getElementById('taxInstBody');

    if (cols.length === 0) {
      headEl.innerHTML = '';
      bodyEl.innerHTML = '<tr><td class="center-col" style="padding:16px; color:#64748b;">請先勾選要列出的講師</td></tr>';
      return;
    }

    headEl.innerHTML = `
      <tr>
        <th style="width:160px;">課程名稱</th>
        ${cols.map(n => `<th>${escapeHtml(n)}</th>`).join('')}
        <th class="no-print" style="width:70px;">操作</th>
      </tr>
    `;

    const colSums = {};
    cols.forEach(n => { colSums[n] = 0; });

    const filteredTaxCourseOptions = taxCourseOptions.filter(c => c !== '上課次數');
    const rowsHtml = taxMatrixRows.map(row => {
      const courseOptsHtml = filteredTaxCourseOptions.map(c =>
        `<option value="${escapeAttr(c)}" ${row.course_name === c ? 'selected' : ''}>${escapeHtml(c)}</option>`
      ).join('');

      const tds = cols.map(n => {
        const raw = row.values ? (row.values[n] ?? '') : '';
        const numVal = Number(String(raw).replace(/,/g, ''));
        if (String(raw).trim() !== '' && Number.isFinite(numVal) && row.course_name !== '上課次數') {
          colSums[n] += numVal;
        }
        const disp = (String(raw).trim() !== '' && Number.isFinite(numVal)) ? fmtNum(numVal) : raw;
        return `<td><input type="text" class="num-input" value="${escapeAttr(disp)}" onchange="onTaxCellChange('${row.id}', '${escapeAttr(n)}', this.value)"></td>`;
      }).join('');

      return `
        <tr>
          <td><select onchange="onTaxRowCourseChange('${row.id}', this.value)">${courseOptsHtml}</select></td>
          ${tds}
          <td class="center-col no-print"><button type="button" class="btn btn-danger btn-sm" onclick="deleteTaxMatrixRow('${row.id}')">刪除</button></td>
        </tr>
      `;
    }).join('');

    const totalTds = cols.map(n => `<td class="num-col">${fmtNum(colSums[n])}</td>`).join('');

    bodyEl.innerHTML = `
      ${rowsHtml}
      <tr class="total-row">
        <td class="center-col">核銷金額</td>
        ${totalTds}
        <td class="no-print"></td>
      </tr>
    `;
  }

  // 3. 個人所得稅計算_臨時人員（連動關懷核銷 3. 臨時人員時數記錄，每季累計：關懷1-3月、關懷4-6月、關懷7-9月、關懷10-12月）
  async function loadTempStaffQuarterData() {
    currentYear = parseInt(document.getElementById('tempYearSelect').value, 10) || 115;
    document.getElementById('tempTaxTitle').textContent = `${currentYear}年度廚房臨時人員`;
    setStatus('讀取關懷臨時人員時數記錄...');

    try {
      const [staffRes, hoursRes] = await Promise.all([
        supabaseClient.from('temp_staff').select('name, status').order('staff_number', { ascending: true }),
        supabaseClient.from('temp_staff_hours').select('*').eq('roc_year', currentYear)
      ]);
      tempHoursRecords = hoursRes.data || [];
      const dbStaffNames = (staffRes.data || []).map(s => (s.name || '').trim()).filter(Boolean);
      const recStaffNames = [...new Set(tempHoursRecords.map(r => (r.staff_name || '').trim()).filter(Boolean))];
      tempStaffList = [...new Set([...dbStaffNames, ...recStaffNames])];
      if (tempStaffList.length === 0) {
        tempStaffList = ['施汶浬', '徐邱鳳嬌', '邱鳳廷', '張瑞合', '邱和妹'];
      }
      setStatus(`已同步 ${currentYear} 年度關懷臨時人員時數`);
    } catch (e) {
      setStatus('讀取臨時人員資料失敗', true);
    }

    renderTempStaffQuarterTable();
  }

  function calcTempPayAmount(rec) {
    const days = Number(rec.work_days || 0);
    const hrs = Number(rec.hours_per_day || 3);
    const rate = Number(rec.hourly_rate || 196);
    return Math.round(days * hrs * rate);
  }

  function renderTempStaffQuarterTable() {
    const headEl = document.getElementById('tempTaxHead');
    const bodyEl = document.getElementById('tempTaxBody');
    const cols = tempStaffList;

    headEl.innerHTML = `
      <tr>
        <th style="width:140px;">關懷季別</th>
        ${cols.map(n => `<th>${escapeHtml(n)}</th>`).join('')}
      </tr>
    `;

    const quarters = [
      { label: '關懷1-3月', months: [1, 2, 3] },
      { label: '關懷4-6月', months: [4, 5, 6] },
      { label: '關懷7-9月', months: [7, 8, 9] },
      { label: '關懷10-12月', months: [10, 11, 12] }
    ];

    const colGrandTotals = {};
    cols.forEach(n => { colGrandTotals[n] = 0; });

    const rowsHtml = quarters.map(q => {
      const tds = cols.map(name => {
        const sum = tempHoursRecords
          .filter(r => (r.staff_name || '').trim() === name && q.months.includes(Number(r.month)))
          .reduce((acc, r) => acc + calcTempPayAmount(r), 0);
        colGrandTotals[name] += sum;
        return `<td class="num-col">${sum > 0 ? fmtNum(sum) : ''}</td>`;
      }).join('');
      return `
        <tr>
          <td class="center-col" style="font-weight:bold;">${q.label}</td>
          ${tds}
        </tr>
      `;
    }).join('');

    const totalTds = cols.map(n => `<td class="num-col">${colGrandTotals[n] > 0 ? fmtNum(colGrandTotals[n]) : ''}</td>`).join('');

    bodyEl.innerHTML = `
      ${rowsHtml}
      <tr class="total-row">
        <td class="center-col">核銷金額</td>
        ${totalTds}
      </tr>
    `;
  }
</script>

</body>
